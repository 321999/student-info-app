<html>
<head><title>Student Info</title></head>
<body>
  <h1>Student Records</h1>
  <p>student information will be here</p>
  <p>Page visited: {{ visits }} times</p>
  <table border="1">
    <tr><th>Name</th><th>Class</th><th>Marks</th></tr>
    {% for s in students %}
    <tr><td>{{ s.name }}</td><td>{{ s.class }}</td><td>{{ s.marks }}</td></tr>
    {% endfor %}
  </table>
</body>
</html>
